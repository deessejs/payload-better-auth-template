name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/template
      PAYLOAD_SECRET: ci-payload-secret-that-is-long-enough-to-use-for-builds
      BETTER_AUTH_SECRET: ci-better-auth-secret-that-is-long-enough-to-use-for-builds
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm --filter @template/app auth:migrate
      - run: pnpm --filter @template/app payload:migrate
      - name: Confirm migration ownership
        run: |
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'auth' AND table_name IN ('user', 'session', 'account', 'verification')")" = "4"
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('admins', 'examples', 'payload_migrations')")" = "3"
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'user'")" = "0"
      - run: pnpm --filter @template/app build
